# Experiment v2 sampler "hardenedcomp". HARDENED composite: V1/V3 evidence unbudgeted; V2 (missing annotation) 25 %, personal-data presence 25 %, always_sample gets the remaining 50 %; fall-through and global budget enforced.
# Pipeline as in the thesis deployment: memory_limiter -> sampler -> batch (container limit 300 MiB as in the Helm values).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 240
    spike_limit_mib: 60
  batch:
  transparency:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 0
    late_span_check: true
    decide_on_eviction: true
    policies:
      [ { name: hardened-composite, type: composite, composite: {
            max_total_spans_per_second: 1000, fall_through: true, unallocated_share_remaining: true, enforce_total_budget: true,
            unbudgeted_policies: [tilt-evidence],
            composite_sub_policy: [ { name: tilt-evidence, type: tilt_conformity, tilt_conformity: { tilt_url: "file:///etc/tilt/tilt.json", tilt_sha256: "${env:TILT_SHA256}" } },
                                    { name: tilt-missing-annotation, type: tilt_conformity, tilt_conformity: { tilt_url: "file:///etc/tilt/tilt.json", tilt_sha256: "${env:TILT_SHA256}", sample_on: [missing_annotation] } },
                                    { name: personal-data-category-policy, type: ottl_condition, ottl_condition: { error_mode: ignore, span: [ "attributes[\"tilt.dataDisclosed.category\"] != nil" ] } },
                                    { name: always-sample-policy, type: always_sample } ],
            rate_allocation: [ { policy: tilt-missing-annotation, percent: 25 }, { policy: personal-data-category-policy, percent: 25 } ] } } ]
exporters:
  otlp:
    endpoint: sink:4409
    tls: { insecure: true }
    sending_queue: { queue_size: 20000 }
service:
  telemetry: { metrics: { address: 0.0.0.0:8888, level: detailed } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transparency, batch]
      exporters: [otlp]
