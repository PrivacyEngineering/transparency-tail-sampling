# Experiment v2 sampler "transp". Thesis transparency_attribute policy alone (no rate limit), thesis semantics.
# Pipeline as in the thesis deployment: memory_limiter -> sampler -> batch (container limit 300 MiB as in the Helm values).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 240
    spike_limit_mib: 60
  batch:
  transparency:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 0
    policies:
      - name: tilt-check-policy
        type: transparency_attribute
        transparency_attribute: { tilt_url: "file:///etc/tilt/tilt.json" }
exporters:
  otlp:
    endpoint: sink:4407
    tls: { insecure: true }
    sending_queue: { queue_size: 20000 }
service:
  telemetry: { metrics: { address: 0.0.0.0:8888, level: detailed } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transparency, batch]
      exporters: [otlp]
