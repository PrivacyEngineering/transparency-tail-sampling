      - "${EXPERIMENT_TILT:-../tilt/tilt.corrected.json}:/etc/tilt/tilt.json:ro"
    ports: ["18882:8888"]
    depends_on: [sink]
    logging: *logging
  c-head10:
    image: ${COLLECTOR_IMAGE}
    profiles: [experiment]
    command: ["--config=/etc/otelcol/config.yaml"]
