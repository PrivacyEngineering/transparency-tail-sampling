# Benchmark stack: one collector under test (cpus 2, 2 GiB), synthetic generator, discarding sink, TILT HTTP server.
# Driven by run_benchmark.sh; BENCH_CONFIG selects configs/<BENCH_CONFIG>.yaml.
name: ttsbench
services:
  collector:
    image: otel-transparency-collector:dev
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./configs/${BENCH_CONFIG:-B0-none}.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["18888:8888"]
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    depends_on: [sink, tilt-server]
  sink:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./configs/sink.yaml:/etc/otelcol/config.yaml:ro"]
    cpus: 2
  tilt-server:
    image: nginx:alpine
    volumes: ["../../tilt/tilt.corrected.json:/usr/share/nginx/html/tilt.json:ro"]
  generator:
    image: tiltgen:dev
    profiles: [gen]
    cpus: 4
