# Sampler collector "transp" (otel-transparency-collector image, identical binary for all configurations).
# Transparency processor, transparency_attribute policy only (thesis semantics: unannotated spans of declared services count as non-conforming).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  batch:
  transparency:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 0
    policies:
      - name: tilt-check-policy
        type: transparency_attribute
        transparency_attribute: { tilt_url: "file:///etc/tilt/tilt.json" }

exporters:
  otlp:
    endpoint: sink:4408
    tls: { insecure: true }
    sending_queue: { queue_size: 20000 }
service:
  telemetry: { metrics: { address: 0.0.0.0:8888 } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transparency, batch]
      exporters: [otlp]
