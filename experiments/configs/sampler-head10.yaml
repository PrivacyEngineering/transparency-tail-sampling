# Sampler collector "head10" (otel-transparency-collector image, identical binary for all configurations).
# Head-based-equivalent 10% sampling (trace-ID hash).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  batch:
  probabilistic_sampler:
    sampling_percentage: 10
    hash_seed: 22

exporters:
  otlp:
    endpoint: sink:4403
    tls: { insecure: true }
    sending_queue: { queue_size: 20000 }
service:
  telemetry: { metrics: { address: 0.0.0.0:8888 } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp]
